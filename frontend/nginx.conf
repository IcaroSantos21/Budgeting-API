server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # uploads de áudio
    client_max_body_size 20m;

    # a API responde na mesma origem da interface, então não há CORS
    location ~ ^/(transactions|api)(/|$) {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # o fluxo por voz chama a IA e pode demorar
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # rotas do Angular (/add, /list, /audio): sempre devolve o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
