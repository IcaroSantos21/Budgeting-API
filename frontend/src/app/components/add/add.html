<h1 class="mb-6 text-2xl font-bold">Adicionar transação</h1>

<form [formGroup]="form" (ngSubmit)="submit()" class="card space-y-4">
  <label class="block space-y-1">
    <span class="text-sm font-medium">Descrição</span>
    <input type="text" formControlName="description" class="input" />
  </label>

  <label class="block space-y-1">
    <span class="text-sm font-medium">Categoria</span>
    <select formControlName="category" class="input">
      @for (cat of categories; track cat) {
        <option [value]="cat">{{ cat }}</option>
      }
    </select>
  </label>

  <label class="block space-y-1">
    <span class="text-sm font-medium">Valor (R$)</span>
    <input type="number" step="0.01" formControlName="amountInReais" class="input" />
  </label>

  <button type="submit" [disabled]="form.invalid" class="btn">Adicionar</button>

  @if (success()) {
    <p class="text-sm text-green-600 dark:text-green-400">Transação criada com sucesso!</p>
  }
  @if (error()) {
    <p class="text-sm text-red-600 dark:text-red-400">{{ error() }}</p>
  }
</form>
